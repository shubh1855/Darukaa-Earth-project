services:
  db:
    image: postgis/postgis:16-3.4
    container_name: darukaa-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: darukaa
      POSTGRES_USER: darukaa
      POSTGRES_PASSWORD: darukaa
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
