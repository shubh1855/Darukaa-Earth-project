name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - name: Install backend dependencies
        run: uv sync --project backend --group dev
      - name: Check formatting and lint
        run: |
          PYTHONPATH=backend uv run --project backend ruff format --check backend
          PYTHONPATH=backend uv run --project backend ruff check backend
      - name: Run tests
        run: PYTHONPATH=backend uv run --project backend pytest backend/tests

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: darukaa
          POSTGRES_PASSWORD: darukaa
          POSTGRES_DB: darukaa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darukaa -d darukaa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --project backend --group dev
      - name: Run database-backed tests
        env:
          DATABASE_URL: postgresql+psycopg://darukaa:darukaa@localhost:5432/darukaa_test
        run: PYTHONPATH=backend uv run --project backend pytest backend/tests -m integration
