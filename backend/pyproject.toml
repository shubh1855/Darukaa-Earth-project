[project]
name = "darukaa-earth-backend"
version = "0.1.0"
description = "Darukaa Earth API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "PyJWT[crypto]==2.10.1",
  "pwdlib[argon2]==0.2.1",
  "pydantic-settings==2.7.1",
  "python-multipart==0.0.20",
  "email-validator==2.2.0",
  "anyio<4.11",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "httpx==0.28.1",
  "ruff==0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
markers = [
  "integration: integration tests that run with external services",
]
